<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --purple: #6c5ce7;
      --purple-light: #a78bfa;
      --surface: rgba(255, 255, 255, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 18%, rgba(167, 139, 250, 0.45), transparent 24rem),
        radial-gradient(circle at 88% 82%, rgba(96, 165, 250, 0.42), transparent 25rem),
        linear-gradient(135deg, #f8f7ff 0%, #eef5ff 100%);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 15rem;
      height: 15rem;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.32;
      pointer-events: none;
    }

    body::before {
      top: -7rem;
      right: 8%;
      background: #7dd3fc;
    }

    body::after {
      bottom: -8rem;
      left: 10%;
      background: #c4b5fd;
    }

    .card {
      position: relative;
      width: min(90%, 680px);
      padding: clamp(2.5rem, 8vw, 5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: 0 24px 70px rgba(58, 71, 120, 0.16);
      backdrop-filter: blur(16px);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--purple);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.25rem, 11vw, 7rem);
      line-height: 0.95;
      letter-spacing: -0.07em;
      background: linear-gradient(135deg, var(--ink) 15%, var(--purple) 75%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      max-width: 440px;
      margin: 1.5rem auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .dot {
      display: inline-block;
      width: 0.7em;
      height: 0.7em;
      margin-left: 0.08em;
      border-radius: 50%;
      background: var(--purple-light);
      box-shadow: 0 0 22px rgba(167, 139, 250, 0.75);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(0.72);
        opacity: 0.65;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Welcome aboard</p>
    <h1>Hello World<span class="dot" aria-hidden="true"></span></h1>
    <p class="subtitle">A bright beginning to something wonderful. Your first page is ready to go.</p>
  </main>
</body>
</html>
